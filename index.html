<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sveadle - Gissa svenska staden</title>
  <!-- Svensk flagga som SVG favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 10'><rect width='16' height='10' fill='%23006AA7'/><rect x='5' width='2' height='10' fill='%23FECC02'/><rect y='4' width='16' height='2' fill='%23FECC02'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="top-bar">
      <div class="lang-picker" id="langPicker" role="group" aria-label="Language selector">
        <button class="lang-btn active" data-lang="sv" id="langSv" title="Svenska" aria-label="Svenska">
          <svg class="flag-icon" viewBox="0 0 16 10" width="24" height="15" aria-hidden="true">
            <rect width="16" height="10" fill="#006AA7"/>
            <rect x="5" width="2" height="10" fill="#FECC02"/>
            <rect y="4" width="16" height="2" fill="#FECC02"/>
          </svg>
        </button>
        <button class="lang-btn" data-lang="en" id="langEn" title="English" aria-label="English">
          <svg class="flag-icon" viewBox="0 0 60 30" width="24" height="15" aria-hidden="true">
            <clipPath id="uk-clip"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
            <clipPath id="uk-diag"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
            <g clip-path="url(#uk-clip)">
              <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
              <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
              <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uk-diag)" stroke="#C8102E" stroke-width="4"/>
              <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
              <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
            </g>
          </svg>
        </button>
      </div>
    </header>

    <main id="app"></main>

    <footer class="creator-badge" id="footerBadge">
      🇸🇪 <b>Sveadle</b> &nbsp;•&nbsp; Skapat av <span>Alfred Stengard</span>
    </footer>
  </div>

  <div id="toast" class="toast"></div>

  <!-- Canvas Confetti för snygg vinstanimering -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
